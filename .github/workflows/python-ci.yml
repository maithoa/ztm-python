name: Python CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: Scripting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytest ruff==0.15.17 pypdf python-dotenv

      - name: Lint all Python files with Ruff
        run: ruff check .

      - name: Run tests for image-processing
        run: cd image-processing && python -m pytest -q

      - name: Run tests for pdf-with-python
        run: cd pdf-with-python && python -m pytest -q

      - name: Run tests for sending-email-with-python
        run: cd sending-email-with-python && python -m pytest -q
