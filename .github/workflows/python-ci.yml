name: Python CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pytest requests beautifulsoup4 ruff==0.15.17 pypdf python-dotenv

      - name: Lint all Python files with Ruff
        run: ruff check Scripting Scraping

      - name: Run tests for image-processing
        working-directory: Scripting/image-processing
        run: python -m pytest -q

      - name: Run tests for pdf-with-python
        working-directory: Scripting/pdf-with-python
        run: python -m pytest -q

      - name: Run tests for sending-email-with-python
        working-directory: Scripting/sending-email-with-python
        run: python -m pytest -q

      - name: Run tests for checkpassword
        working-directory: Scripting/passwordchecker
        run: python -m pytest -q
      
      - name: Run tests for scrape-hackernews
        working-directory: Scraping/scrape_hackernews
        run: python -m pytest -q
